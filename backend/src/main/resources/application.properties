spring.application.name=chzzk
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chzzk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chzzk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chzzk}

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD_SIZE:500MB}

# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Directory for uploaded videos (local-disk VideoStorage).
app.storage.dir=${APP_STORAGE_DIR:./uploads}

# Live broadcasts (step 2): how long a broadcast stays LIVE after the broadcaster's socket drops
# before it is ended (lets a phone reconnect after a short network blip).
app.live.broadcaster-grace-seconds=${APP_LIVE_GRACE_SECONDS:15}
# ICE servers handed to browsers via GET /api/live/ice-servers. TURN is optional (comma-separated URLs).
app.webrtc.stun-urls=${APP_WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
app.webrtc.turn-urls=${APP_WEBRTC_TURN_URLS:}
app.webrtc.turn-username=${APP_WEBRTC_TURN_USERNAME:}
app.webrtc.turn-credential=${APP_WEBRTC_TURN_CREDENTIAL:}

# Step 3: JWT bearer tokens. APP_JWT_SECRET must be 32+ bytes; when unset a random secret is generated at startup
# (a WARN is logged and tokens stop working after a restart). APP_JWT_TTL is an ISO-8601 duration.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=${APP_JWT_TTL:PT12H}

# Step 4: donations via Toss Payments (TEST mode only). Keys come from the environment ONLY; without them the server
# still starts and donations are reported as disabled. Never put real keys in this file.
app.toss.client-key=${TOSS_CLIENT_KEY:}
app.toss.secret-key=${TOSS_SECRET_KEY:}
app.toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}
app.toss.webhook-enabled=${TOSS_WEBHOOK_ENABLED:false}
# Escape hatch for live keys (test_ prefix is required otherwise). This assignment is test-mode only: keep false.
app.toss.allow-live-keys=${TOSS_ALLOW_LIVE_KEYS:false}
# Where Toss sends the browser after the payment window: <base>/donations/success and <base>/donations/fail.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
