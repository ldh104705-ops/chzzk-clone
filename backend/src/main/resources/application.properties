spring.application.name=chzzk
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chzzk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chzzk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chzzk}

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD_SIZE:500MB}

# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Directory for uploaded videos (local-disk VideoStorage).
app.storage.dir=${APP_STORAGE_DIR:./uploads}

# Live broadcasts (step 2): how long a broadcast stays LIVE after the broadcaster's socket drops
# before it is ended (lets a phone reconnect after a short network blip).
app.live.broadcaster-grace-seconds=${APP_LIVE_GRACE_SECONDS:15}
# ICE servers handed to browsers via GET /api/live/ice-servers. TURN is optional (comma-separated URLs).
app.webrtc.stun-urls=${APP_WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
app.webrtc.turn-urls=${APP_WEBRTC_TURN_URLS:}
app.webrtc.turn-username=${APP_WEBRTC_TURN_USERNAME:}
app.webrtc.turn-credential=${APP_WEBRTC_TURN_CREDENTIAL:}

# Step 3: JWT bearer tokens. APP_JWT_SECRET must be 32+ bytes; when unset a random secret is generated at startup
# (a WARN is logged and tokens stop working after a restart). APP_JWT_TTL is an ISO-8601 duration.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=${APP_JWT_TTL:PT12H}

# Step 4: donations via Toss Payments (TEST mode only). Keys come from the environment ONLY; without them the server
# still starts and donations are reported as disabled. Never put real keys in this file.
app.toss.client-key=${TOSS_CLIENT_KEY:}
app.toss.secret-key=${TOSS_SECRET_KEY:}
app.toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}
app.toss.webhook-enabled=${TOSS_WEBHOOK_ENABLED:false}
# Escape hatch for live keys (test_ prefix is required otherwise). This assignment is test-mode only: keep false.
app.toss.allow-live-keys=${TOSS_ALLOW_LIVE_KEYS:false}
# Where Toss sends the browser after the payment window: <base>/donations/success and <base>/donations/fail.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# ---- Step 5: running several instances ----
# local: single instance, everything in memory (default; ./gradlew bootRun works without Redis).
# redis: shared state in Redis (logout denylist, live signaling presence + relay, reaper). Needs SPRING_DATA_REDIS_URL
#        (Railway's REDIS_URL, e.g. redis://default:pass@host:6379) or SPRING_DATA_REDIS_HOST/PORT, and APP_JWT_SECRET.
app.cluster.mode=${APP_CLUSTER_MODE:local}
# Redis connection (only used in redis mode). SPRING_DATA_REDIS_URL (redis://user:pass@host:port, or rediss:// for TLS), if set, overrides host/port.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Live presence: how long a broadcaster's presence key survives without a heartbeat, how often instances refresh it,
# and (reaper) how often orphaned broadcasts are looked for / how long a never-started READY broadcast may wait.
app.live.presence-ttl-seconds=${APP_LIVE_PRESENCE_TTL_SECONDS:10}
app.live.heartbeat-seconds=${APP_LIVE_HEARTBEAT_SECONDS:3}
app.live.reaper-interval-seconds=${APP_LIVE_REAPER_INTERVAL_SECONDS:5}
app.live.ready-ttl-seconds=${APP_LIVE_READY_TTL_SECONDS:3600}

# Video storage: local (files under app.storage.dir) or s3 (S3-compatible bucket: MinIO locally, Cloudflare R2 in production).
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:chzzk-videos}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:}
app.storage.s3.path-style=${APP_STORAGE_S3_PATH_STYLE:true}
app.storage.s3.create-bucket=${APP_STORAGE_S3_CREATE_BUCKET:false}

# Adds "X-Instance: <hostname>" to every response so a demo can show which pod answered. Off by default.
app.instance-header.enabled=${APP_INSTANCE_HEADER:false}

# Operations: finish in-flight requests on SIGTERM (rolling updates, scale-in), trust X-Forwarded-* from the proxy/ingress,
# and expose /actuator/health/liveness and /actuator/health/readiness for Kubernetes/Railway probes.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${APP_SHUTDOWN_TIMEOUT:25s}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Readiness = ready to take traffic: database reachable (add redis in cluster mode via APP_READINESS_INCLUDE).
management.endpoint.health.group.readiness.include=${APP_READINESS_INCLUDE:readinessState,db}
