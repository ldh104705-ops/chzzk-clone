# TEMPLATE ONLY - placeholders, not real values. deploy/scripts/up.sh creates the real Secret (named chzzk-secrets)
# with freshly generated random values; nothing secret is ever committed. To create it by hand instead:
#   kubectl -n chzzk create secret generic chzzk-secrets \
#     --from-literal=APP_JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=MINIO_ROOT_USER="chzzk-$(openssl rand -hex 4)" \
#     --from-literal=MINIO_ROOT_PASSWORD="$(openssl rand -hex 16)"
# This file is intentionally NOT listed in kustomization.yaml, so `kubectl apply -k` never applies the placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: chzzk-secrets
  namespace: chzzk
type: Opaque
stringData:
  APP_JWT_SECRET: "<random string, at least 32 bytes>"
  POSTGRES_PASSWORD: "<random string>"
  MINIO_ROOT_USER: "<random string, at least 3 chars>"
  MINIO_ROOT_PASSWORD: "<random string, at least 8 chars>"
  # Optional, only if you want donations to work (Toss TEST keys, see README):
  # TOSS_CLIENT_KEY: "test_gck_..."
  # TOSS_SECRET_KEY: "test_gsk_..."
